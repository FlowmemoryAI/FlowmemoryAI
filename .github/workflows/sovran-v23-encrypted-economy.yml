name: SOVRAN V23 Encrypted Economy Render

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/sovran-v23/**'

permissions:
  contents: read

concurrency:
  group: sovran-v23-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - name: Check out render branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation curl
          python3 -m pip install --upgrade pip
          python3 -m pip install requests numpy scipy librosa soundfile pillow "yt-dlp[default,curl-cffi]" piper-tts
          python3 -m piper.download_voices en_US-norman-medium --download-dir assets_v23/voices

      - name: Render SOVRAN V23
        shell: bash
        run: |
          mkdir -p out
          set -o pipefail
          python3 tools/sovran-v23/render.py 2>&1 | tee out/runner_v23.log

      - name: Upload render log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SOVRAN_V23_RENDER_LOG
          retention-days: 3
          if-no-files-found: warn
          path: |
            out/runner_v23.log
            out/render_v23.log

      - name: Upload finished film
        uses: actions/upload-artifact@v4
        with:
          name: SOVRAN_V23_ENCRYPTED_ECONOMY
          retention-days: 3
          if-no-files-found: error
          path: |
            out/SOVRAN_ENCRYPTED_ECONOMY_V23_WEB.mp4
            out/SOVRAN_ENCRYPTED_ECONOMY_V23_MASTER.mp4
            out/SOVRAN_V23_NARRATION_ONLY.mp3
            out/SOVRAN_V23_FULL_MIX.mp3
            out/SOVRAN_V23_SOUNDTRACK_EDIT.mp3
            out/SOVRAN_V23_POSTER.jpg
            out/SOVRAN_V23_CONTACT.jpg
            out/SOVRAN_V23_CLIMAX_CONTACT.jpg
            out/SOVRAN_V23_END_CHECK.jpg
            out/SOVRAN_V23_BRAND.png
            out/SOVRAN_V23_STORY_SCRIPT.md
            out/SOVRAN_V23_VOICEOVER_SCRIPT.txt
            out/CREDITS.txt
            out/SOURCE_MANIFEST.json
            out/EDIT_QA.json
            out/runner_v23.log
            out/render_v23.log
