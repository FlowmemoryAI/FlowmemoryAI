name: S0VRAN V22 Auction Render

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/s0vran-v22/**'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out render branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation curl espeak-ng
          python3 -m pip install --upgrade pip
          python3 -m pip install requests numpy scipy librosa soundfile pillow "yt-dlp[default,curl-cffi]" piper-tts
          python3 -m piper.download_voices en_GB-cori-high --download-dir assets_v22/voices

      - name: Render S0VRAN V22
        shell: bash
        run: |
          mkdir -p out
          set -o pipefail
          python3 tools/s0vran-v22/render.py 2>&1 | tee out/runner_v22.log

      - name: Upload render log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S0VRAN_V22_RENDER_LOG
          retention-days: 3
          if-no-files-found: warn
          path: |
            out/runner_v22.log
            out/render_v22.log

      - name: Upload finished film
        uses: actions/upload-artifact@v4
        with:
          name: S0VRAN_V22_THE_AUCTION
          retention-days: 3
          if-no-files-found: error
          path: |
            out/S0VRAN_THE_AUCTION_V22_WEB.mp4
            out/S0VRAN_THE_AUCTION_V22_MASTER.mp4
            out/S0VRAN_V22_NARRATION_ONLY.mp3
            out/S0VRAN_V22_FULL_MIX.mp3
            out/S0VRAN_V22_SOUNDTRACK_EDIT.mp3
            out/S0VRAN_V22_POSTER.jpg
            out/S0VRAN_V22_CONTACT.jpg
            out/S0VRAN_V22_CLIMAX_CONTACT.jpg
            out/S0VRAN_V22_END_CHECK.jpg
            out/S0VRAN_V22_STORY_SCRIPT.md
            out/CREDITS.txt
            out/SOURCE_MANIFEST.json
            out/EDIT_QA.json
            out/runner_v22.log
            out/render_v22.log
