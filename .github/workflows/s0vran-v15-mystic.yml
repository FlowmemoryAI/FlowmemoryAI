name: S0VRAN V15 Mystic Story Render

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/s0vran-v15/**'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Check out render branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl
          python3 -m pip install --upgrade pip
          python3 -m pip install requests beautifulsoup4 numpy scipy librosa soundfile pillow

      - name: Render S0VRAN V15 mystic story film
        shell: bash
        run: |
          mkdir -p out
          set -o pipefail
          python3 tools/s0vran-v15/render.py 2>&1 | tee out/runner_v15.log

      - name: Upload render log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S0VRAN_V15_RENDER_LOG
          retention-days: 3
          if-no-files-found: warn
          path: |
            out/runner_v15.log
            out/render_v15.log

      - name: Upload finished film
        uses: actions/upload-artifact@v4
        with:
          name: S0VRAN_V15_MYSTIC_FILM
          retention-days: 3
          if-no-files-found: error
          path: |
            out/S0VRAN_BEYOND_THE_VEIL_V15_WEB.mp4
            out/S0VRAN_BEYOND_THE_VEIL_V15_MASTER.mp4
            out/S0VRAN_V15_SOUNDTRACK_EDIT.mp3
            out/S0VRAN_V15_POSTER.jpg
            out/S0VRAN_V15_CONTACT.jpg
            out/S0VRAN_V15_CLIMAX_CONTACT.jpg
            out/S0VRAN_V15_STORY_SCRIPT.md
            out/CREDITS.txt
            out/SOURCE_MANIFEST.json
            out/EDIT_QA.json
            out/runner_v15.log
            out/render_v15.log
