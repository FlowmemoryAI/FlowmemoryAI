name: S0VRAN Live-Action Render

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/s0vran-live/**'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out render branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl
          python3 -m pip install --upgrade pip
          python3 -m pip install numpy pillow yt-dlp

      - name: Render live-action S0VRAN film
        shell: bash
        run: |
          set +e
          python3 - <<'PY' > render.log 2>&1
          from pathlib import Path
          import ast, base64, lzma, re
          loader = Path('tools/s0vran-live/render.py').read_text(encoding='utf-8')
          payload = ast.literal_eval(re.search(r'^P=(.+)$', loader, re.MULTILINE).group(1))
          code = lzma.decompress(base64.b64decode(payload)).decode('utf-8')
          code = code.replace('st=.48', 'st=0.48').replace('d=.75', 'd=0.75').replace('d=.42', 'd=0.42')
          code = code.replace('("cbp", 5.0, 53', '("cbp", 18.0, 53')
          exec(compile(code, 'render_payload.py', 'exec'), {'__name__': '__main__'})
          PY
          status=$?
          tail -n 350 render.log
          exit $status

      - name: Upload render log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S0VRAN_LIVE_ACTION_V11_LOG
          retention-days: 3
          path: render.log

      - name: Upload finished film
        uses: actions/upload-artifact@v4
        with:
          name: S0VRAN_LIVE_ACTION_V11
          retention-days: 3
          if-no-files-found: error
          path: |
            out/S0VRAN_LIVE_ACTION_V11_WEB.mp4
            out/S0VRAN_LIVE_ACTION_V11_MASTER.mp4
            out/S0VRAN_LIVE_ACTION_V11_POSTER.jpg
            out/S0VRAN_LIVE_ACTION_V11_CONTACT.jpg
            out/S0VRAN_LIVE_ACTION_V11_SCORE.mp3
            out/CREDITS.txt
            out/SOURCE_MANIFEST.json
