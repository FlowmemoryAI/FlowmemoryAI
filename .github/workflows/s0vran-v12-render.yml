name: S0VRAN V12 Live-Action Render

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/s0vran-v12/**'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out render branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core curl
          python3 -m pip install --upgrade pip
          python3 -m pip install requests beautifulsoup4 pillow numpy scipy librosa soundfile "yt-dlp[default,curl-cffi]"

      - name: Render S0VRAN V12
        run: python3 tools/s0vran-v12/render.py

      - name: Upload render log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S0VRAN_V12_RENDER_LOG
          retention-days: 3
          if-no-files-found: warn
          path: out/render.log

      - name: Upload render outputs
        uses: actions/upload-artifact@v4
        with:
          name: S0VRAN_V12_BEAT_SYNC
          retention-days: 3
          if-no-files-found: error
          path: |
            out/S0VRAN_V12_BEAT_SYNC_WEB.mp4
            out/S0VRAN_V12_BEAT_SYNC_MASTER.mp4
            out/S0VRAN_V12_POSTER.jpg
            out/S0VRAN_V12_CONTACT.jpg
            out/S0VRAN_V12_SOUNDTRACK_PREVIEW.mp3
            out/CREDITS.txt
            out/SOURCE_MANIFEST.json
            out/BEAT_MAP.json
            out/render.log
