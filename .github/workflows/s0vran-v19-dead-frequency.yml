name: S0VRAN V19 Dead Frequency Render

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/s0vran-v19/**'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out render branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation curl
          python3 -m pip install --upgrade pip
          python3 -m pip install requests numpy scipy librosa soundfile pillow

      - name: Render S0VRAN V19
        shell: bash
        run: |
          mkdir -p out
          set -o pipefail
          python3 tools/s0vran-v19/render.py 2>&1 | tee out/runner_v19.log

      - name: Upload render log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: S0VRAN_V19_RENDER_LOG
          retention-days: 3
          if-no-files-found: warn
          path: |
            out/runner_v19.log
            out/render_v19.log

      - name: Upload finished film
        uses: actions/upload-artifact@v4
        with:
          name: S0VRAN_V19_DEAD_FREQUENCY
          retention-days: 3
          if-no-files-found: error
          path: |
            out/S0VRAN_DEAD_FREQUENCY_V19_WEB.mp4
            out/S0VRAN_DEAD_FREQUENCY_V19_MASTER.mp4
            out/S0VRAN_V19_SOUNDTRACK_EDIT.mp3
            out/S0VRAN_V19_POSTER.jpg
            out/S0VRAN_V19_CONTACT.jpg
            out/S0VRAN_V19_CLIMAX_CONTACT.jpg
            out/S0VRAN_V19_END_CHECK.jpg
            out/S0VRAN_V19_STORY_SCRIPT.md
            out/CREDITS.txt
            out/SOURCE_MANIFEST.json
            out/EDIT_QA.json
            out/runner_v19.log
            out/render_v19.log
