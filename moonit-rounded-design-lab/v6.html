<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonit Prime — Professional Fintech Lab</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080c;color:#f4f7fb;font:14px system-ui}#boot{height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,#101d35,#05080c 58%)}.card{padding:22px 27px;border:1px solid #29384c;border-radius:18px;background:#0b1119;box-shadow:0 28px 90px #000b}.dot{display:inline-block;width:8px;height:8px;border-radius:99px;background:#4f8fff;box-shadow:0 0 20px #4f8fff;margin-right:10px;animation:p .9s infinite alternate}@keyframes p{to{opacity:.3;transform:scale(.82)}}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><div id="boot"><div class="card"><span class="dot"></span>Opening Moonit Prime Professional Fintech Lab…</div></div><script>(async()=>{try{const files=['v6-part-1.txt','v6-part-2.txt'];const b=(await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);return r.text()}))).join('');const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();const frame=document.createElement('iframe');frame.title='Moonit Prime Professional Fintech Lab';frame.allow='fullscreen';frame.srcdoc=html;document.body.replaceChildren(frame)}catch(e){document.getElementById('boot').innerHTML='<div class="card">Unable to open the lab. Refresh once in a current Chrome or Safari browser.</div>';console.error(e)}})();</script></body></html>
