<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonit Full-Screen UI/UX Lab</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020407;color:#eaf2ff;font:14px system-ui}#boot{height:100%;display:grid;place-items:center}.card{padding:20px 24px;border:1px solid #24344a;border-radius:22px;background:#09111c;box-shadow:0 24px 80px #0009}.dot{display:inline-block;width:8px;height:8px;border-radius:99px;background:#54a7ff;box-shadow:0 0 18px #54a7ff;margin-right:10px;animation:p 1s infinite alternate}@keyframes p{to{opacity:.35}}iframe{display:block;width:100%;height:100%;border:0;background:#020407}</style></head><body><div id="boot"><div class="card"><span class="dot"></span>Opening full-screen Moonit UI/UX Lab…</div></div><script>(async()=>{try{const files=['v2-part-1.txt','v2-part-2.txt','v2-part-3.txt','v2-part-4.txt','v2-part-5.txt'];const b=(await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);return r.text()}))).join('');const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();const frame=document.createElement('iframe');frame.title='Moonit Full-Screen UI/UX Lab';frame.allow='fullscreen';frame.srcdoc=html;document.body.replaceChildren(frame)}catch(error){document.getElementById('boot').innerHTML='<div class="card">Unable to open the design lab. Refresh once or use a current Chrome/Safari browser.</div>';console.error(error)}})();</script></body></html>
