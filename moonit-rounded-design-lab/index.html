<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonit Rounded Design Lab</title><style>html,body{height:100%;margin:0;background:#05070a;color:#eaf2ff;font:14px system-ui}body{display:grid;place-items:center}.loader{padding:26px 30px;border:1px solid #26354c;border-radius:26px;background:linear-gradient(145deg,#0d1520,#080d14);box-shadow:0 28px 100px #000a}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#54a7ff;box-shadow:0 0 22px #54a7ff;margin-right:10px;animation:p .8s infinite alternate}@keyframes p{to{opacity:.3}}</style></head><body><div class="loader"><span class="dot"></span>Loading the Moonit design lab…</div><script>(async()=>{try{const names=['part-1.txt','part-2.txt','part-3.txt','part-4.txt','part-5.txt'];const parts=await Promise.all(names.map(async n=>{const r=await fetch(n,{cache:'no-store'});if(!r.ok)throw new Error(n);return r.text()}));document.open();document.write(parts.join(''));document.close()}catch(e){document.body.innerHTML='<div class="loader">The preview did not load. Refresh the page once.</div>'}})();</script></body></html>
