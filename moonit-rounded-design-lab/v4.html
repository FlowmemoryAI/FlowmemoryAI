<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonit Radical Trenches Design Lab</title><meta name="description" content="Full-screen coded Moonit Trenches UI/UX laboratory with twelve radically different design systems."><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020407;color:#eef6ff;font:14px system-ui}#boot{height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,#0d1a34,#020407 58%)}.card{padding:22px 27px;border:1px solid #2a3b56;border-radius:24px;background:rgba(8,15,27,.92);box-shadow:0 28px 90px #000b;backdrop-filter:blur(16px)}.dot{display:inline-block;width:9px;height:9px;border-radius:99px;background:#67b7ff;box-shadow:0 0 22px #67b7ff;margin-right:11px;animation:p .9s infinite alternate}@keyframes p{to{opacity:.28;transform:scale(.8)}}iframe{display:block;width:100%;height:100%;border:0;background:#020407}</style></head><body><div id="boot"><div class="card"><span class="dot"></span>Opening Moonit Radical Trenches Design Lab…</div></div><script>(async()=>{try{const files=['v4-part-1.txt','v4-part-2.txt','v4-part-3.txt','v4-part-4.txt','v4-part-5.txt'];const b=(await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);return r.text()}))).join('');const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();const frame=document.createElement('iframe');frame.title='Moonit Radical Trenches Design Lab';frame.allow='fullscreen';frame.srcdoc=html;document.body.replaceChildren(frame)}catch(e){document.getElementById('boot').innerHTML='<div class="card">Unable to open the design lab. Refresh once in a current Chrome or Safari browser.</div>';console.error(e)}})();</script></body></html>
