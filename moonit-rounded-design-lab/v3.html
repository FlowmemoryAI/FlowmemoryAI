<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moonit Trenches UI/UX Evolution Lab</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030609;color:#eaf4ff;font:14px system-ui}#boot{height:100%;display:grid;place-items:center}.card{padding:20px 24px;border:1px solid #273a4e;border-radius:22px;background:#09111a;box-shadow:0 24px 80px #0009}.dot{display:inline-block;width:8px;height:8px;border-radius:99px;background:#51a7ff;box-shadow:0 0 18px #51a7ff;margin-right:10px;animation:p 1s infinite alternate}@keyframes p{to{opacity:.35}}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><div id="boot"><div class="card"><span class="dot"></span>Opening Moonit Trenches UI/UX Lab…</div></div><script>(async()=>{try{const files=['v3-part-1.txt','v3-part-2.txt','v3-part-3.txt','v3-part-4.txt'];const b=(await Promise.all(files.map(async f=>{const r=await fetch(f,{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);return r.text()}))).join('');const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();const frame=document.createElement('iframe');frame.title='Moonit Trenches UI/UX Lab';frame.allow='fullscreen';frame.srcdoc=html;document.body.replaceChildren(frame)}catch(e){document.getElementById('boot').innerHTML='<div class="card">Unable to open the lab. Refresh once in a current Chrome or Safari browser.</div>';console.error(e)}})();</script></body></html>
